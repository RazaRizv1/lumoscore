<style>/*lxts:1.1*/
:root{
  --accent:#ea6a2c; --accent-2:#ff9a3d; --accent-soft:rgba(234,106,44,0.14);
  --bg:#0a0a0b; --surface:#131317; --surface-2:#1a1a21; --border:#26262c; --border-strong:#34343d;
  --text:#f6f5f3; --text-soft:#6e6d78; --text-muted:#a5a4ac; --green:#34d399;
  --shadow:0 30px 80px -20px rgba(0,0,0,0.7);
}
html[data-theme="light"]{
  --accent:#ea6a2c; --accent-2:#ff894c; --accent-soft:#ffe5d3;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#fafbfc; --border:#ececef; --border-strong:#e2e2e6;
  --text:#0e0e10; --text-soft:#a6a6b0; --text-muted:#6b6b75; --green:#16a34a;
  --shadow:0 30px 80px -28px rgba(30,30,60,0.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg); color:var(--text); font-family:'Hanken Grotesk',sans-serif; font-size:17.6px; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden; position:relative;}
.mono{font-family:'JetBrains Mono',monospace; font-feature-settings:"tnum"}

/* backdrop */
.backdrop{position:fixed; inset:0; z-index:0; overflow:hidden}
.grid{position:absolute; inset:-2px;
  background-image:linear-gradient(rgba(120,120,140,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,120,140,0.05) 1px,transparent 1px);
  background-size:46px 46px; mask-image:radial-gradient(ellipse 80% 70% at 50% 42%,#000 35%,transparent 78%);}
html[data-theme="dark"] .grid{background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px)}
.orb{position:absolute; border-radius:50%; filter:blur(60px); pointer-events:none}
.o1{width:340px;height:340px;background:#ea6a2c;top:-90px;left:-60px;opacity:.30}
.o2{width:300px;height:300px;background:#6f5ded;bottom:-110px;right:-40px;opacity:.28}
.o3{width:220px;height:220px;background:#a855f7;top:38%;right:8%;opacity:.20}
.o4{width:200px;height:200px;background:#10b981;bottom:6%;left:6%;opacity:.18}
html[data-theme="light"] .orb{opacity:.14}
html[data-theme="light"] .o1{opacity:.18}
.vignette{position:absolute; inset:0; background:radial-gradient(ellipse 70% 60% at 50% 45%,transparent 40%,rgba(0,0,0,0.5) 100%)}
html[data-theme="light"] .vignette{background:radial-gradient(ellipse 90% 80% at 50% 45%,transparent 55%,rgba(120,130,160,0.10) 100%)}

/* sheet (matches app modal) */
.stage{position:relative; z-index:2; width:min(456px,calc(100vw - 32px))}
.sheet{position:relative; background:var(--surface); border:1px solid var(--border); border-radius:18px;
  box-shadow:var(--shadow); overflow:hidden}
.sheet::before{content:""; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.6}

.step{display:none}
.step.active{display:block; animation:stepIn .42s cubic-bezier(.16,.84,.44,1) both}
@keyframes stepIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* head */
.head{display:flex; align-items:flex-start; gap:15.4px; padding:24.2px 26.4px; border-bottom:1px solid var(--border); position:relative}
.head .ico{width:44px;height:44px;border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:transparent; filter:drop-shadow(0 4px 12px rgba(234,106,44,0.35))}
.head .ico.plain{background:transparent; box-shadow:none; padding:0}
.head .htext{flex:1; min-width:0; padding-top:1.1px}
.head h2{font-size:23.1px; font-weight:800; letter-spacing:-0.025em; line-height:1.15}
.head .sub{font-size:15.4px; color:var(--text-muted); margin-top:4.4px; line-height:1.45}
.head .sub b{color:var(--text); font-weight:700}
.x{position:absolute; top:18px; right:18px; width:32px;height:32px; border-radius:9px; border:1px solid var(--border);
  background:transparent; color:var(--text-muted); display:flex;align-items:center;justify-content:center; cursor:pointer; transition:.16s}
.x:hover{color:var(--text); border-color:var(--border-strong); background:var(--surface-2)}
.back{display:inline-flex; align-items:center; justify-content:center; width:32px;height:32px; border-radius:9px;
  border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; transition:.16s; flex-shrink:0}
.back:hover{color:var(--text); border-color:var(--border-strong); background:var(--surface-2)}

/* body / foot */
.body{padding:24.2px 26.4px}
.foot{padding:15.4px 26.4px 24.2px}
.accent{color:var(--accent)}

/* buttons */
.btn{width:100%; height:56px; border-radius:14px; border:none; cursor:pointer; font-family:inherit; font-size:17.6px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:12.1px; transition:transform .15s, box-shadow .2s, background .2s, border-color .2s}
.btn:active{transform:translateY(1px) scale(.995)}
.btn-google{background:#fff; color:#1a1a23; border:1px solid transparent; box-shadow:0 8px 22px -10px rgba(0,0,0,0.5)}
html[data-theme="light"] .btn-google{border-color:var(--border-strong); box-shadow:0 6px 18px -10px rgba(30,30,60,0.18)}
.btn-google:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; box-shadow:0 10px 28px -8px var(--accent)}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 16px 38px -8px var(--accent)}
.btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border-strong); background:var(--surface)}
html[data-theme="light"] .btn-ghost:hover{background:var(--surface-2)}
.btn .arr{transition:transform .2s} .btn-primary:hover .arr{transform:translateX(3px)}

.or{display:flex; align-items:center; gap:13.2px; margin:17.6px 0; color:var(--text-soft); font-size:13.2px; font-weight:700; letter-spacing:.1em; text-transform:uppercase}
.or::before,.or::after{content:""; height:1px; flex:1; background:var(--border)}
.guest-note{font-size:14.9px; color:var(--text-soft); text-align:center; line-height:1.55; margin-top:17.6px; display:flex; align-items:center; justify-content:center; gap:7.7px}
.guest-note svg{color:var(--accent); flex-shrink:0}
.legal{font-size:13.8px; color:var(--text-soft); text-align:center; line-height:1.6; margin-top:15.4px}
.legal a{color:var(--text-muted); text-decoration:none; border-bottom:1px solid var(--border)}

/* search */
.search{display:flex; align-items:center; gap:12.1px; padding:0 15.4px; height:48px; border:1px solid var(--border); border-radius:13px;
  background:var(--bg); margin-bottom:15.4px; transition:.16s}
html[data-theme="light"] .search{background:var(--surface-2)}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1; min-width:0; border:none; outline:none; background:transparent; color:var(--text); font-family:inherit; font-size:16.5px}
.search input::placeholder{color:var(--text-soft)}
.search svg{color:var(--text-soft)}

/* option rows */
.opt-list{display:flex; flex-direction:column; gap:9.9px}
.opt{display:flex; align-items:center; gap:15.4px; width:100%; text-align:left; cursor:pointer; padding:16.5px 17.6px;
  border:1px solid var(--border); border-radius:14px; background:var(--surface-2); font-family:inherit; color:var(--text);
  transition:.16s; position:relative; overflow:hidden}
html[data-theme="light"] .opt{background:var(--surface-2)}
.opt:hover:not(.soon){border-color:var(--border-strong); transform:translateX(2px)}
html[data-theme="dark"] .opt:hover:not(.soon){background:#20202a}
.opt.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px rgba(234,106,44,0.10)}
.opt.soon{opacity:.5; cursor:not-allowed}
.opt .ico{width:46px;height:46px;border-radius:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center}
.opt .meta{flex:1; min-width:0}
.opt .nm{font-size:18.2px; font-weight:700; letter-spacing:-0.01em}
.opt .desc{font-size:14.9px; color:var(--text-soft); display:flex; align-items:center; gap:6.6px; margin-top:2.2px}
.opt .desc .wic{width:15px;height:15px;border-radius:50%; flex-shrink:0}
.opt .tag{font-size:12.1px; font-weight:700; letter-spacing:.03em; padding:4.4px 9.9px; border-radius:20px; white-space:nowrap}
.tag-last{background:var(--accent-soft); color:var(--accent)}
.tag-soon{background:var(--border); color:var(--text-muted)}
.opt .go{margin-left:auto; color:var(--text-soft); transition:.16s}
.opt:hover:not(.soon) .go{color:var(--accent); transform:translateX(3px)}
.kit{display:flex; align-items:center; justify-content:center; gap:7.7px; margin-top:19.8px; font-size:14.3px; color:var(--text-soft); font-weight:600}
.kit b{color:var(--text-muted); border-bottom:1px solid var(--border)}

/* POOL-DETAIL TAB STRIPS ON A PHONE.
   #ptabs measures 432px of tabs inside a 345px box, so "Participants" sits past the right edge and is
   simply unreachable — on a narrower handset "Transactions" and "My Position" go with it. The strip is
   overflow:auto on BOTH axes too, so instead of doing nothing a tap drags the row (the same defect the
   Trade-asset tab strip had). Deposit/Withdraw is the same shape: two fixed 152px buttons, 304px of
   content that stops fitting below ~330px of viewport.
   Fix both the way the Trade strip was fixed: the tabs SHARE the width and the row cannot scroll at all.
   overflow must be set on both axes — one non-visible axis forces the other to auto, which is what made
   it draggable vertically. */
@media (max-width:760px){
  #ptabs.panel-tabs{display:flex!important;flex-wrap:nowrap!important;overflow:hidden!important;gap:0!important;padding-bottom:2px}
  /* size to content, share what is left: equal quarters clipped "Deposit / Withdraw", which is much longer
     than the other three. The four together measure ~333px inside 345px, so they all fit unclipped; the
     min-width:0 + ellipsis below is the safety net for a narrower handset. */
  #ptabs.panel-tabs>*{flex:1 1 auto!important;min-width:0!important;padding-left:3px!important;padding-right:3px!important;
    font-size:11px!important;letter-spacing:-.1px;white-space:nowrap;text-align:center;justify-content:center!important;overflow:hidden;text-overflow:ellipsis}
  .dw-tabs{display:flex!important;flex-wrap:nowrap!important;overflow:hidden!important}
  .dw-tabs>*{flex:1 1 0!important;min-width:0!important;white-space:nowrap}
}
/* Small handsets (iPhone SE and friends): at 11px the four labels want ~302px inside a 290px strip, so
   every one of them ellipsised by a few pixels. A step down to 10px needs ~269px and they read in full. */
@media (max-width:359px){
  #ptabs.panel-tabs>*{font-size:10px!important;padding-left:2px!important;padding-right:2px!important}
}

   The vsub holds the mock $ (and an .lc-money the site re-stamps) — earlier it wasn't covered, so the

   MOCK text (e.g. "51,250 XLM swapped") which wraps to 2 lines in the narrow column and makes the whole
   top section ~40px taller until real (short) data lands. One-lining the skeleton keeps height stable. */

   the two read as one broken block. The separation was never its own: it came from the pagination row
   between them, which is display:none on the My Pools tab, so the collision appeared there and nowhere

.lumos-promo.lm-on.lm-pools{min-height:366px!important;overflow:hidden;background:radial-gradient(58% 84% at 70% 30%,rgba(140,96,246,.26),transparent 60%),radial-gradient(46% 64% at 92% 78%,rgba(198,86,232,.14),transparent 62%),radial-gradient(52% 68% at 24% 90%,rgba(74,110,224,.12),transparent 62%),linear-gradient(140deg,#0f1120 0%,#0a0a15 55%,#070610 100%)!important}
.lm-pools .lm{min-height:366px!important}

.lm-pools .lm::after{background:linear-gradient(100deg,rgba(9,9,18,.66) 12%,rgba(9,9,18,.16) 46%,transparent 72%)!important;z-index:2!important}
/* bigger text, forced light so it stays readable on the dark card in LIGHT theme too */
.lm-pools .lm-c-pool{position:relative;z-index:4;padding-top:21px}
.lm-pools .lm-h{font-size:38px!important;line-height:1.08!important;color:#fff!important;margin-bottom:13px!important;letter-spacing:-.01em}
.lm-pools .lm-sub{font-size:15.5px!important;line-height:1.55!important;max-width:380px!important;color:rgba(228,230,245,.76)!important;margin-bottom:22px!important}
.lm-pools .lm-cta{font-size:14.5px!important;padding:13px 22px!important}
.lm-pools .lm-chip{z-index:4!important;background:rgba(16,15,32,.62)!important;border:1px solid rgba(255,255,255,.12)!important;backdrop-filter:blur(6px);padding:21px 27px!important;min-width:0;width:max-content;max-width:360px}
.lm-pools .lm-chip .p1,.lm-pools .lm-chip .p2,.lm-pools .lm-chip .p3{display:none!important}
.lx-hstats{display:grid;grid-template-columns:auto auto;gap:20px 24px}
.lx-hstat{display:flex;flex-direction:column;gap:4px;min-width:0}
.lx-hstat .v{font:800 29px/1.05 'Hanken Grotesk',sans-serif;color:#fff;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lx-hstat .l{font:600 13px/1.2 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:rgba(228,230,245,.6)}
/* Top Pool stat: show the pair logos beside the "CODE / XLM" text */
.lx-hstat[data-k=top] .v{display:flex;align-items:center;gap:12px}
/* #2: the top-pool code was hidden behind its own second logo.
   Six rules from four stylesheets size this element, and one of them -- added later, for the pair marks
   elsewhere -- sets gap:6px on [data-paired]. The nudge below (.pb{left:23px}) was written for a
   container with no gap, so the second mark ended up 33+6+23 = 62px in, inside a box declared 57px wide,
   and jutted far enough past it to sit on the U of "USDC / XLM".
   Overlap the two by geometry instead of by a nudge that assumes a particular flow: no gap, a negative
   margin, and no offset. The box is then exactly as wide as what is in it, and the text starts after it. */
.lx-hstat[data-k=top] .pair-icons{width:auto!important;flex:0 0 auto!important;gap:0!important;height:33px}
.lx-hstat[data-k=top] .pair-icons .pa.lx-ico,.lx-hstat[data-k=top] .pair-icons .pb.lx-ico{width:33px!important;height:33px!important;border:2.5px solid rgba(22,20,42,.95);box-sizing:border-box;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.lx-hstat[data-k=top] .pair-icons .pb.lx-ico{left:0!important;margin-left:-10px!important}
.lx-hstat[data-k=top] .pair-icons .pa.lx-ico[data-mono]::after,.lx-hstat[data-k=top] .pair-icons .pb.lx-ico[data-mono]::after{font-size:13px}
.lx-hstat[data-k=top] .lx-toptxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:20px}
/* #29: the pool page's own header pair -- two 44px logos with a 6px gap between them, reading as two
   unrelated tokens rather than one pair. Everywhere else a pair is drawn overlapping, so this was the
   odd one out. Both already carry a 3px ring, which is what makes the overlap legible; the base asset
   stays on top so the pair reads left to right in the same order as the name beside it. */
/* #9: and the box has to BE a row. On the phone the design lays .ph-icons out as display:block, so the
   two 44px marks stacked -- the second one landing 44px below the first, on top of the text under it.
   The overlap rule below is a no-op in block layout, which is why it read as a broken logo rather than
   a pair. Measured before: pa at y141, pb at y185, inside a 60px-wide box. */
.pool-header .ph-icons{display:flex!important;align-items:center;flex-wrap:nowrap;width:auto!important;gap:0!important}
.pool-header .ph-icons .pa{position:relative;z-index:2}
.pool-header .ph-icons .pb{position:relative;z-index:1;left:0!important;margin-left:4px!important}
/* My Positions "View position" — themed pill button (light + dark) instead of a raw link */
.lx-ammview{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:9px;font:700 12.5px/1 'Hanken Grotesk',sans-serif;text-decoration:none!important;white-space:nowrap;border:1px solid rgba(234,106,44,.38);color:var(--accent,#ea6a2c)!important;background:rgba(234,106,44,.10);transition:background .15s ease,color .15s ease,border-color .15s ease}
.lx-ammview:hover{background:var(--accent,#ea6a2c);color:#fff!important;border-color:var(--accent,#ea6a2c)}
.pair-icons .pa .lx-mono{display:grid;place-items:center;width:100%;height:100%;color:#fff;font-weight:800;font-family:'JetBrains Mono',monospace;font-size:12px;border-radius:50%}
/* Pool Transactions pager, phone. The design ships a .tx-foot on desktop and nothing here, so this is
   built to match it: same wording, same Prev / Page N of M / Next, sized for a thumb (44px targets). */
.lx-txfoot-m{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}
.lx-txfoot-m .controls{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto}
.lx-txfoot-m button{min-height:34px;padding:8px 11px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text);font:600 12px/1 'Hanken Grotesk',sans-serif;-webkit-tap-highlight-color:transparent}
.lx-txfoot-m button:disabled{opacity:.4}
.lx-txfoot-m .lx-txpg{margin:0 7px;white-space:nowrap;font-size:12px;color:var(--text-muted)}
.lx-txfoot-m .lx-txinfo{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* injected cosmic decor (nebulae drift, orb floats, particles rise, stars twinkle) */
.lx-cosmic{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.lx-neb{position:absolute;border-radius:50%;filter:blur(50px);mix-blend-mode:screen;will-change:transform}
.lx-neb.n1{width:600px;height:470px;right:-70px;top:-130px;background:radial-gradient(circle,rgba(140,96,246,.62),transparent 66%);animation:lxNeb1 30s ease-in-out infinite alternate}
.lx-neb.n2{width:480px;height:430px;right:150px;bottom:-180px;background:radial-gradient(circle,rgba(206,88,236,.44),transparent 66%);animation:lxNeb2 36s ease-in-out infinite alternate}
.lx-neb.n3{width:410px;height:340px;left:32%;top:4%;background:radial-gradient(circle,rgba(72,120,232,.34),transparent 66%);animation:lxNeb1 33s ease-in-out infinite alternate-reverse}
@keyframes lxNeb1{from{transform:translate(0,0) scale(1)}to{transform:translate(-48px,36px) scale(1.18)}}
@keyframes lxNeb2{from{transform:translate(0,0) scale(1)}to{transform:translate(54px,-32px) scale(1.12)}}
.lx-stars{position:absolute;inset:0;animation:lxTw 7s ease-in-out infinite;background-repeat:no-repeat;background-image:
radial-gradient(1.6px 1.6px at 17% 24%,rgba(255,255,255,.9),transparent 60%),
radial-gradient(1.3px 1.3px at 61% 16%,rgba(255,255,255,.62),transparent 60%),
radial-gradient(1.7px 1.7px at 83% 52%,rgba(255,255,255,.74),transparent 60%),
radial-gradient(1.1px 1.1px at 45% 66%,rgba(255,255,255,.5),transparent 60%),
radial-gradient(1.4px 1.4px at 93% 30%,rgba(255,255,255,.64),transparent 60%),
radial-gradient(1.2px 1.2px at 34% 44%,rgba(255,255,255,.5),transparent 60%),
radial-gradient(1.5px 1.5px at 73% 80%,rgba(255,255,255,.58),transparent 60%),
radial-gradient(1px 1px at 55% 90%,rgba(255,255,255,.42),transparent 60%),
radial-gradient(1.3px 1.3px at 12% 66%,rgba(255,255,255,.52),transparent 60%),
radial-gradient(1.6px 1.6px at 70% 40%,rgba(255,255,255,.66),transparent 60%),
radial-gradient(1.1px 1.1px at 88% 66%,rgba(255,255,255,.46),transparent 60%),
radial-gradient(1.2px 1.2px at 26% 80%,rgba(255,255,255,.48),transparent 60%)}
@keyframes lxTw{0%,100%{opacity:.6}50%{opacity:1}}
.lx-constel{position:absolute;right:3%;top:50%;transform:translateY(-50%);width:330px;height:330px;opacity:.95;pointer-events:none;animation:lxConFloat 12s ease-in-out infinite}
@keyframes lxConFloat{0%,100%{transform:translateY(-50%)}50%{transform:translateY(calc(-50% - 12px))}}
.lx-constel line{stroke:rgba(150,120,240,.26);stroke-width:1}
.lx-constel circle{fill:#cbbaff;filter:drop-shadow(0 0 5px rgba(168,128,255,.9));animation:lxNode 4.5s ease-in-out infinite}
@keyframes lxNode{0%,100%{opacity:.5}50%{opacity:1}}
/* #6/#2, desktop half. Same story as the mobile rule above: this forced the hero back to block so the
   copy would top-align with the floating chip. _poolshero.js now lays the hero out as a flex column and
   puts the strip last with order:9 -- but order does nothing in a block container, so the strip rendered
   in DOM order, i.e. ABOVE the headline, and the Pools hero stopped matching the Trade hero it is meant
   to mirror. Removing it lets that flex layout actually apply. */
.lx-part{position:absolute;border-radius:50%;background:rgba(214,196,255,.85);box-shadow:0 0 9px rgba(172,132,255,.9);animation:lxDrift linear infinite}
.lx-part.p1{width:5px;height:5px;left:57%;bottom:14%;animation-duration:15s}
.lx-part.p2{width:4px;height:4px;left:74%;bottom:8%;animation-duration:19s;animation-delay:-4s}
.lx-part.p3{width:6px;height:6px;left:66%;bottom:22%;animation-duration:23s;animation-delay:-9s}
.lx-part.p4{width:3px;height:3px;left:85%;bottom:12%;animation-duration:17s;animation-delay:-2s}
@keyframes lxDrift{0%{transform:translateY(20px);opacity:0}12%{opacity:1}86%{opacity:1}100%{transform:translateY(-160px);opacity:0}}
#poolsBody tr td:last-child,#panelAllPools thead th:last-child{text-align:center!important}
#lx-mypanel{opacity:1!important;visibility:visible!important;animation:none!important}
/* lx-poolsweight: match the Trade tables. Pools body numbers computed to font-weight 400 while the
   Trade tables render theirs at 700 (both JetBrains Mono), so the two sections read as different
   typefaces. Only the PRIMARY numeric line is bolded — the $ sub-line under it stays lighter, which
   is how Trade does it too. Columns 1-2 (# and PAIR) are left alone; :last-child covers Participants,
   which is bare text in the td with no inner div. */
table.pools tbody tr.lx-ammrow td:nth-child(n+3)>div:first-child,
table.pools tbody tr.lx-ammrow td:last-child{font-weight:700}

/* My Position asset logos. We insert a real <img> into the design's 24px .mpm-asset-ico bubble, but the
   phone stylesheet only ever expected a LETTER in there, so it sizes nothing: a 181x181 USDC png landed
   inside a 24px clipped circle and you saw one magnified corner — which reads exactly like a broken
   placeholder. Desktop's .mp-asset-ico had the sizing; mobile did not. Cover both. */
/* #6 (batch 5): the participants footer ships baked as "Viewing 1 - 17 of 847" -- the design's mock --
   and on a desktop refresh that sat there for the whole time the pool was loading, which is a specific
   wrong number rather than an obviously empty one. Hidden until our own pager writes it (.lx-partfoot
   is added by partFoot), with the usual failsafe so a stalled load leaves it blank rather than gone. */
.part-foot:not(.lx-partfoot){visibility:hidden}

/* #14: the header stats row ships as three fixed columns. It now carries a fourth -- Providers. Four
   across on a desktop card; on a phone four would leave ~85px per box for a label like "Fees Collected
   (24h)", so it folds to 2x2 there instead. */
.ph-stats{grid-template-columns:repeat(4,1fr)!important}
/* #20: the + between the two Create Pool assets sits ON the seam between the cards, so it depends on
   having a solid ground of its own and on being above them -- without either it reads as a glyph
   caught half under an edge. Given both, plus a glyph that is centred by geometry rather than by line
   box (an svg with display:block cannot inherit a stray baseline). Could not reproduce the exact
   breakage reported, so this changes only what could plausibly cause it and nothing else. */
#createPoolModal .plus{position:relative;z-index:2;flex:0 0 30px;width:30px;height:30px;
  background:var(--surface,#fff)!important;line-height:0;
  display:flex!important;align-items:center!important;justify-content:center!important}
#createPoolModal .plus svg{display:block;width:14px;height:14px;flex:0 0 14px}
.ph-stat .ic.part{background:var(--purple-soft,rgba(139,92,246,.13));color:var(--purple,#8b5cf6)}
@media(max-width:900px){.ph-stats{grid-template-columns:repeat(2,1fr)!important}}

.mp-asset-ico img,.mpm-asset-ico img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.mpm-asset-ico{overflow:hidden;display:inline-flex;align-items:center;justify-content:center}

/* Trailing explorer arrow on a phone transaction row (desktop has one per table row). */
.tx-item .lx-txext{flex-shrink:0;margin-left:8px;align-self:center;color:var(--text-muted);display:inline-flex;
  align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;text-decoration:none}
/* identicon fills the icon slot edge to edge; the design tints that slot per type, which would show
   through the identicon's transparent corners */
.tx-item .tx-icon.lx-txident{background:none!important;padding:0!important;overflow:hidden;border-radius:50%}
.tx-item .tx-icon.lx-txident svg{display:block;width:100%;height:100%}
.tx-item .lx-txext:active{background:var(--surface-2);color:var(--accent)}
</style><style id="lx-walletlogo-css">
/* The avatar is a background-image disc in both places. Swapping the image is enough -- size, radius
   and ring stay whatever each surface already sets. */
.mu-av.lx-haswl,.lx-tw-av.lx-haswl{background-size:cover!important;background-position:center!important;
  background-repeat:no-repeat!important}
/* A mark on a white ground would otherwise read as a hole punched in the header. The ring gives it an
   edge; it is translucent so it works on either theme. */
.mu-av.lx-haswl,.lx-tw-av.lx-haswl{box-shadow:inset 0 0 0 1px rgba(127,127,140,.30)}
/* ...but a mark with a transparent ground has no tile for the ring to edge, so it would draw an empty
   box around the artwork. Those carry .lx-wl-bare instead (RAZA asked for a transparent rabet on
   2026-09-20, and it is the first logo here that has no ground of its own). */
.mu-av.lx-wl-bare,.lx-tw-av.lx-wl-bare{box-shadow:none!important}
/* The network mark was drawn by a child svg in the phone card; with a wallet logo behind it, hide it. */
.mu-av.lx-haswl>svg,.lx-tw-av.lx-haswl>svg{display:none!important}
/* ...and by a child IMG in the desktop chip, which this rule did not cover. _walletchip2.js bakes the
   chain mark in as an <img>, so on desktop it sat ON TOP of the wallet logo: the chip showed Stellar
   where the phone menu showed the wallet you are actually connected with. Worse, that mark is a CIRCLE
   inside a 28px rounded SQUARE, so its four transparent corners let the wallet logo behind it bleed
   through as a light fringe -- the "white from the sides" on a dark chip. Both were the same element.
   Hidden only when a real wallet logo is behind it (.lx-haswl); with none, the chain mark still shows. */
.mu-av.lx-haswl>img,.lx-tw-av.lx-haswl>img{display:none!important}
