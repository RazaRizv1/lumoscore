<title>Sign In | LumosCore</title>
  <meta name="description" content="Connect a Stellar wallet to use LumosCore.">
  <meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --accent:#ea6a2c; --accent-2:#ff9a3d; --accent-soft:rgba(234,106,44,0.14);
  --bg:#0a0a0b; --surface:#131317; --surface-2:#1a1a21; --border:#26262c; --border-strong:#34343d;
  --text:#f6f5f3; --text-soft:#6e6d78; --text-muted:#a5a4ac; --green:#34d399;
  --shadow:0 30px 80px -20px rgba(0,0,0,0.7);
}
html[data-theme="light"]{
  --accent:#ea6a2c; --accent-2:#ff894c; --accent-soft:#ffe5d3;
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#fafbfc; --border:#ececef; --border-strong:#e2e2e6;
  --text:#0e0e10; --text-soft:#a6a6b0; --text-muted:#6b6b75; --green:#16a34a;
  --shadow:0 30px 80px -28px rgba(30,30,60,0.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg); color:var(--text); font-family:'Hanken Grotesk',sans-serif; font-size:16px; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden; position:relative;}
.mono{font-family:'JetBrains Mono',monospace; font-feature-settings:"tnum"}

/* backdrop */
.backdrop{position:fixed; inset:0; z-index:0; overflow:hidden}
.grid{position:absolute; inset:-2px;
  background-image:linear-gradient(rgba(120,120,140,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,120,140,0.05) 1px,transparent 1px);
  background-size:46px 46px; mask-image:radial-gradient(ellipse 80% 70% at 50% 42%,#000 35%,transparent 78%);}
html[data-theme="dark"] .grid{background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px)}
.orb{position:absolute; border-radius:50%; filter:blur(60px); pointer-events:none}
.o1{width:340px;height:340px;background:#ea6a2c;top:-90px;left:-60px;opacity:.30}
.o2{width:300px;height:300px;background:#6f5ded;bottom:-110px;right:-40px;opacity:.28}
.o3{width:220px;height:220px;background:#a855f7;top:38%;right:8%;opacity:.20}
.o4{width:200px;height:200px;background:#10b981;bottom:6%;left:6%;opacity:.18}
html[data-theme="light"] .orb{opacity:.14}
html[data-theme="light"] .o1{opacity:.18}
.vignette{position:absolute; inset:0; background:radial-gradient(ellipse 70% 60% at 50% 45%,transparent 40%,rgba(0,0,0,0.5) 100%)}
html[data-theme="light"] .vignette{background:radial-gradient(ellipse 90% 80% at 50% 45%,transparent 55%,rgba(120,130,160,0.10) 100%)}

/* sheet (matches app modal) */
.stage{position:relative; z-index:2; width:min(456px,calc(100vw - 32px))}
.sheet{position:relative; background:var(--surface); border:1px solid var(--border); border-radius:18px;
  box-shadow:var(--shadow); overflow:hidden}
.sheet::before{content:""; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.6}

.step{display:none}
.step.active{display:block; animation:stepIn .42s cubic-bezier(.16,.84,.44,1) both}
@keyframes stepIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* head */
.head{display:flex; align-items:flex-start; gap:14px; padding:22px 24px; border-bottom:1px solid var(--border); position:relative}
.head .ico{width:44px;height:44px;border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:transparent; filter:drop-shadow(0 4px 12px rgba(234,106,44,0.35))}
.head .ico.plain{background:transparent; box-shadow:none; padding:0}
.head .htext{flex:1; min-width:0; padding-top:1px}
.head h2{font-size:21px; font-weight:800; letter-spacing:-0.025em; line-height:1.15}
.head .sub{font-size:14px; color:var(--text-muted); margin-top:4px; line-height:1.45}
.head .sub b{color:var(--text); font-weight:700}
.x{position:absolute; top:18px; right:18px; width:32px;height:32px; border-radius:9px; border:1px solid var(--border);
  background:transparent; color:var(--text-muted); display:flex;align-items:center;justify-content:center; cursor:pointer; transition:.16s}
.x:hover{color:var(--text); border-color:var(--border-strong); background:var(--surface-2)}
.back{display:inline-flex; align-items:center; justify-content:center; width:32px;height:32px; border-radius:9px;
  border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; transition:.16s; flex-shrink:0}
.back:hover{color:var(--text); border-color:var(--border-strong); background:var(--surface-2)}

/* body / foot */
.body{padding:22px 24px}
.foot{padding:14px 24px 22px}
.accent{color:var(--accent)}

/* buttons */
.btn{width:100%; height:56px; border-radius:14px; border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:11px; transition:transform .15s, box-shadow .2s, background .2s, border-color .2s}
.btn:active{transform:translateY(1px) scale(.995)}
.btn-google{background:#fff; color:#1a1a23; border:1px solid transparent; box-shadow:0 8px 22px -10px rgba(0,0,0,0.5)}
html[data-theme="light"] .btn-google{border-color:var(--border-strong); box-shadow:0 6px 18px -10px rgba(30,30,60,0.18)}
.btn-google:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#fff; box-shadow:0 10px 28px -8px var(--accent)}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 16px 38px -8px var(--accent)}
.btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border-strong); background:var(--surface)}
html[data-theme="light"] .btn-ghost:hover{background:var(--surface-2)}
.btn .arr{transition:transform .2s} .btn-primary:hover .arr{transform:translateX(3px)}

.or{display:flex; align-items:center; gap:12px; margin:16px 0; color:var(--text-soft); font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase}
.or::before,.or::after{content:""; height:1px; flex:1; background:var(--border)}
.guest-note{font-size:13.5px; color:var(--text-soft); text-align:center; line-height:1.55; margin-top:16px; display:flex; align-items:center; justify-content:center; gap:7px}
.guest-note svg{color:var(--accent); flex-shrink:0}
.legal{font-size:12.5px; color:var(--text-soft); text-align:center; line-height:1.6; margin-top:14px}
.legal a{color:var(--text-muted); text-decoration:none; border-bottom:1px solid var(--border)}

/* search */
.search{display:flex; align-items:center; gap:11px; padding:0 14px; height:48px; border:1px solid var(--border); border-radius:13px;
  background:var(--bg); margin-bottom:14px; transition:.16s}
html[data-theme="light"] .search{background:var(--surface-2)}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1; min-width:0; border:none; outline:none; background:transparent; color:var(--text); font-family:inherit; font-size:15px}
.search input::placeholder{color:var(--text-soft)}
.search svg{color:var(--text-soft)}

/* option rows */
.opt-list{display:flex; flex-direction:column; gap:9px}
.opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer; padding:15px 16px;
  border:1px solid var(--border); border-radius:14px; background:var(--surface-2); font-family:inherit; color:var(--text);
  transition:.16s; position:relative; overflow:hidden}
html[data-theme="light"] .opt{background:var(--surface-2)}
.opt:hover:not(.soon){border-color:var(--border-strong); transform:translateX(2px)}
html[data-theme="dark"] .opt:hover:not(.soon){background:#20202a}
.opt.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px rgba(234,106,44,0.10)}
.opt.soon{opacity:.5; cursor:not-allowed}
.opt .ico{width:46px;height:46px;border-radius:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center}
.opt .meta{flex:1; min-width:0}
.opt .nm{font-size:16.5px; font-weight:700; letter-spacing:-0.01em}
.opt .desc{font-size:13.5px; color:var(--text-soft); display:flex; align-items:center; gap:6px; margin-top:2px}
.opt .desc .wic{width:15px;height:15px;border-radius:50%; flex-shrink:0}
.opt .tag{font-size:11px; font-weight:700; letter-spacing:.03em; padding:4px 9px; border-radius:20px; white-space:nowrap}
.tag-last{background:var(--accent-soft); color:var(--accent)}
.tag-soon{background:var(--border); color:var(--text-muted)}
.opt .go{margin-left:auto; color:var(--text-soft); transition:.16s}
.opt:hover:not(.soon) .go{color:var(--accent); transform:translateX(3px)}
.kit{display:flex; align-items:center; justify-content:center; gap:7px; margin-top:18px; font-size:13px; color:var(--text-soft); font-weight:600}
.kit b{color:var(--text-muted); border-bottom:1px solid var(--border)}

/* loader */
.loader-wrap{padding:30px 24px 30px; text-align:center}

<script>
(function(){

  var idx=0;
  function show(i){
    idx=i;
    document.querySelectorAll('.step').forEach(function(s){ s.classList.toggle('active', parseInt(s.getAttribute('data-step'))===i); });
    if(i===3) runLoader();
  }
  function gotoHome(){
    try{ if(window.top && window.top.lxNavigate){ window.top.lxNavigate(['lumoscore-home.html','lumoscore-home-mobile.html']); return true; } }catch(e){}
    return false;
  }
  function exit(){
    try{ if(window.top && window.top.lxNavigate){ window.top.lxNavigate(['lumoscore-landing.html','lumoscore-landing-mobile.html']); return; } }catch(e){}
    show(0);
  }

  document.querySelectorAll('[data-go]').forEach(function(b){
    if(b.hasAttribute('data-net')) return; // handled below
    b.addEventListener('click',function(){ show(parseInt(b.getAttribute('data-go'))); });
  });
  document.querySelectorAll('[data-net]').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('[data-net]').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel');
      setTimeout(function(){ show(parseInt(b.getAttribute('data-go'))); }, 150);
    });
  });
  document.querySelectorAll('[data-back]').forEach(function(b){ b.addEventListener('click',function(){ if(idx>1) show(idx-1); else exit(); }); });
  document.querySelectorAll('[data-exit]').forEach(function(b){ b.addEventListener('click',exit); }); show(1);

  // loader
  var STAGES=[
    {p:18, s:'Setting up engine', sub:'Booting the LumosCore runtime…', hint:'Initializing'},
    {p:42, s:'Connecting to network', sub:'Handshaking with the ledger…', hint:'Securing channel'},
    {p:66, s:'Routing liquidity', sub:'Mapping pools across chains…', hint:'Building routes'},
    {p:86, s:'Syncing assets', sub:'Loading balances & trustlines…', hint:'Almost there'},
    {p:100,s:'Welcome to LumosCore', sub:'Taking you to your dashboard…', hint:'Done'}
  ];
  var ran=false;
  function runLoader(){
    if(ran) reset(); ran=true;
    var fill=document.getElementById('loadFill'), pct=document.getElementById('loadPct'),
        st=document.getElementById('loadStatus'), sub=document.getElementById('loadSub'), hint=document.getElementById('loadHint');
    var chips=document.querySelectorAll('.lchip'); var i=0;
    function tick(){
      if(i>=STAGES.length){ setTimeout(function(){ if(idx===3){ if(!gotoHome()) show(0); } }, 620); return; }
      var s=STAGES[i]; fill.style.width=s.p+'%';
      st.textContent=s.s;
      sub.textContent=s.sub; hint.textContent=s.hint; if(chips[i]) chips[i].classList.add('done');
      var target=s.p, cur=parseInt(pct.textContent)||0;
      var t=setInterval(function(){ cur+=(target>cur?1:0); pct.textContent=cur+'%'; if(cur>=target) clearInterval(t); }, 14);
      i++; setTimeout(tick, 860);
    }
    tick();
  }
  function reset(){ document.getElementById('loadFill').style.width='0%'; document.getElementById('loadPct').textContent='0%'; document.querySelectorAll('.lchip').forEach(function(c){c.classList.remove('done');}); }
})();
</script>

var ORDER=["aptos","hedera","starknet","vechain","worldchain","stellar","xrpl"];
var BASE="aptos",cur=BASE,obs=null;
function noswap(node){
  var el=node.nodeType===3?node.parentNode:node;
  while(el){
    if(el.nodeType===1){
      var tn=el.tagName;
      if(tn==="SCRIPT"||tn==="STYLE"||tn==="NOSCRIPT")return true;
      if(el.hasAttribute&&el.hasAttribute("data-lx-noswap"))return true;
      var cn=el.className;
      if(cn&&typeof cn==="string"&&/lxw-|lxns-|lxmc/.test(cn))return true;
    }
    el=el.parentNode;
  }
  return false;
}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
// swap a subtree/text node from chain fc -> tc (text identity + logos)
function walkSwap(root,fc,tc){
  if(fc===tc||!CHAINS[fc]||!CHAINS[tc])return;
  var f=CHAINS[fc],t=CHAINS[tc];
  var nameRe=new RegExp(esc(f.name),"g"),tkRe=new RegExp("\\b"+esc(f.tk)+"\\b","g");
  function fix(nd){nd.nodeValue=nd.nodeValue.replace(nameRe,t.name).replace(tkRe,t.tk);}
  if(root.nodeType===3){ if(!noswap(root)&&root.nodeValue&&(root.nodeValue.indexOf(f.name)>=0||root.nodeValue.indexOf(f.tk)>=0))fix(root); return; }
  if(root.nodeType!==1)return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(!n.nodeValue||noswap(n))return NodeFilter.FILTER_REJECT;
    return (n.nodeValue.indexOf(f.name)>=0||n.nodeValue.indexOf(f.tk)>=0)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }});
  var arr=[],n;while(n=w.nextNode())arr.push(n);arr.forEach(fix);
  var imgs=root.querySelectorAll?root.querySelectorAll("img"):[];
  for(var i=0;i<imgs.length;i++){if(imgs[i].getAttribute("src")===f.logo&&!(imgs[i].closest&&imgs[i].closest("[data-lx-noswap]")))imgs[i].setAttribute("src",t.logo);}
  if(root.tagName==="IMG"&&root.getAttribute("src")===f.logo&&!(root.closest&&root.closest("[data-lx-noswap]")))root.setAttribute("src",t.logo);
}
function guard(fn){if(obs)obs.disconnect();try{fn();}finally{if(obs&&document.body)obs.observe(document.body,{childList:true,subtree:true,characterData:true});}}
function applyChain(to){
  if(!CHAINS[to]||to===cur)return;
  guard(function(){walkSwap(document.body,cur,to);});
  cur=to;try{localStorage.setItem("lumos.chain",to);}catch(_){}
  updSwitcher();try{window.dispatchEvent(new Event("lx-chainchange"));}catch(_){}
}
window.lxSetChain=applyChain;window.lxGetChain=function(){return cur;};
function updSwitcher(){
  var sw=document.getElementById("lxmc");if(!sw)return;
  var nm=sw.querySelector(".lxmc-name");if(nm)nm.textContent=CHAINS[cur].name;
  var lg=sw.querySelector(".lxmc-logo");if(lg)lg.innerHTML='<img src="'+CHAINS[cur].logo+'" alt="">';
  sw.querySelectorAll(".lxmc-opt").forEach(function(o){o.classList.toggle("active",o.getAttribute("data-net")===cur);});
}
function buildSwitcher(){
  if(document.getElementById("lxmc"))return;
  var host=document.querySelector(".lx-topwallet");
  var bar=host?host.parentNode:(document.querySelector(".topbar-right")||document.querySelector(".ah-right"));
  if(!bar)return;
  var sw=document.createElement("div");sw.id="lxmc";sw.className="lxmc";sw.setAttribute("data-lx-noswap","");
  var opts=ORDER.map(function(id){return '<button class="lxmc-opt" type="button" data-net="'+id+'"><span class="lxmc-ol"><img src="'+CHAINS[id].logo+'" alt=""></span>'+CHAINS[id].name+'</button>';}).join("");
  sw.innerHTML='<button class="lxmc-trig" type="button"><span class="lxmc-logo"></span><span class="lxmc-name"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button><div class="lxmc-menu" hidden>'+opts+'</div>';
  if(host)bar.insertBefore(sw,host);else bar.appendChild(sw);
  sw.querySelector(".lxmc-trig").addEventListener("click",function(e){e.stopPropagation();sw.querySelector(".lxmc-menu").toggleAttribute("hidden");});
  sw.querySelectorAll(".lxmc-opt").forEach(function(o){o.addEventListener("click",function(e){e.stopPropagation();applyChain(o.getAttribute("data-net"));sw.querySelector(".lxmc-menu").setAttribute("hidden","");});});
  document.addEventListener("click",function(){var m=sw.querySelector(".lxmc-menu");if(m)m.setAttribute("hidden","");});
  updSwitcher();
}

// keep newly-rendered (base-identity) content in sync with the active chain
function startObserver(){
  if(obs||!document.body)return;
  obs=new MutationObserver(function(muts){
    if(cur===BASE)return;
    guard(function(){
      for(var j=0;j<muts.length;j++){var m=muts[j];
        for(var i=0;i<m.addedNodes.length;i++)walkSwap(m.addedNodes[i],BASE,cur);
        if(m.type==="characterData"&&m.target)walkSwap(m.target,BASE,cur);
      }
    });
  });
  obs.observe(document.body,{childList:true,subtree:true,characterData:true});
}
function reskin(){ if(cur!==BASE) guard(function(){walkSwap(document.body,BASE,cur);}); } // catch anything rendered late
function boot(){
  // No in-app network switcher: the network is chosen at connect time (Choose a network -> wallet).
  // To change networks the user disconnects and reconnects on another network. We still re-skin the
  // app to whichever network was connected (via the saved lumos.chain), but show no topbar dropdown.
  startObserver();
  var saved=null;try{saved=localStorage.getItem("lumos.chain");}catch(_){}
  try{ if(saved&&CHAINS[saved]&&saved!==cur)applyChain(saved); }catch(_){}
